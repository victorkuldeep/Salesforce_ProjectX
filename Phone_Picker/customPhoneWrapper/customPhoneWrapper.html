<template>
    <div class="phone-wrapper">
        <!-- Embedded phone picker -->
        <template if:true={renderPhonePicker}>
            <c-custom-phone-picker
                input-elem={label}
                mandatory="true"
                default-country={isoCode}
                phone-number={phoneNumber}
                onvaluechange={handleCustomPhone}
            >
            </c-custom-phone-picker>
            <template if:true={enableSave}>
                <lightning-button-icon
                    icon-name="utility:save"
                    alternative-text="Save"
                    variant="container"
                    title="Save"
                    size="small"
                    onclick={handleSave}
                >
                </lightning-button-icon>
            </template>
        </template>
    </div>
</template>
